<script>
(() => {
 'use strict';
 function install() {
  if(document.getElementById('ukePlayback')) return;
  const card=document.createElement('section');
  card.id='ukePlayback';card.className='card';
  card.innerHTML=`<div class="section-title">Listen & practise</div>
   <div class="up-row"><button id="upRecord" class="up-primary">▶ Play recording</button><button id="upClose" hidden>■ Close recording</button><a id="upSearch" class="up-link" target="_blank" rel="noopener noreferrer">Find recording ↗</a></div>
   <a id="upMusic" class="up-link" target="_blank" rel="noopener noreferrer" hidden>♫ Open in YouTube Music ↗</a><div id="upMedia"></div><p id="upRecordingStatus" role="status"></p>
   <details><summary>Recording options</summary><p>Paste a YouTube link once for this song, or choose an audio file from your device.</p>
   <label for="upUrl">YouTube link</label><input id="upUrl" type="url" placeholder="https://www.youtube.com/watch?v=…">
   <div class="up-row"><button id="upSave">Save link</button><button id="upClear">Reset recording</button></div>
   <label for="upFile">Audio file (choose again after reopening the app)</label><input id="upFile" type="file" accept="audio/*"></details>
   <hr style="border:0;border-top:1px solid #f0eae1;margin:18px 0">
   <strong>Ukulele practice loop</strong><p>Chord-change exercise: one chord per bar, in the order below. This is not the song’s exact arrangement and does not sync to the recording.</p>
   <div id="upChords" class="up-chords"></div>
   <div class="up-row"><label>Speed <input id="upTempo" type="range" min="40" max="180" value="80"> <output id="upBpm">80 BPM</output></label></div>
   <div class="up-row"><label>Pattern <select id="upPattern"><option value="down">Easy downstrums (4 beats)</option><option value="island">Island strum (4 beats)</option><option value="waltz">Waltz (3 beats)</option></select></label><label><input id="upLoop" type="checkbox" checked> Repeat</label></div>
   <div class="up-row"><button id="upPractice" class="up-primary">▶ Start practice</button><button id="upStop">■ Stop</button></div><p id="upStatus" role="status">Start with slow downstrums, then try the island pattern.</p>`;
  document.querySelector('.song-header-card').after(card);
  const $=id=>document.getElementById(id);
  const seed={"Don't Stop Believin'": "e20MmHgMvlM", "Valerie": "Xdyb9F3oxy4", "Somewhere Over The Rainbow": "j85Q4bWQgCI", "Lean On Me": "79x_XaYEOu4", "Fix You": "3vOfD06jhTQ", "Defying Gravity": "t7YD6bWkuXE", "Keep Holding On": "5mfCFCZDx4o", "Smooth Criminal": "00ce5qjAV_w", "Hey, Soul Sister": "xAtqJSY4TVs", "Landslide": "A6La_yFNO_w"};
  let saved={};try{const v=JSON.parse(localStorage.getItem('uke_recordings_v1')||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))saved=v;}catch(e){}
  const files=new Map();let shown=-1, running=false,paused=false,token=0,timer=null,step=0,nextTime=0,sequence=[];
  const voices=new Set(),visualTimers=new Set();
  const song=()=>SONGS[currentSongIndex];
  const key=()=>song().title+'|'+song().artist;
  const video=()=>seed[song().title]||saved[key()]||'';
  function persist(){try{localStorage.setItem('uke_recordings_v1',JSON.stringify(saved));return true;}catch(e){return false;}}
  function parseVideo(value){
   try{const u=new URL(value);if(!['https:','http:'].includes(u.protocol))return '';let id='';
    if(u.hostname==='youtu.be')id=u.pathname.slice(1).split('/')[0];
    else if(['youtube.com','www.youtube.com','m.youtube.com','www.youtube-nocookie.com'].includes(u.hostname))id=u.searchParams.get('v')||(/^\/(?:embed|shorts|live)\/([^/]+)/.exec(u.pathname)||[])[1]||'';
    return /^[\w-]{11}$/.test(id)?id:'';
   }catch(e){return '';}
  }
  function closeRecording(){$('upMedia').replaceChildren();$('upClose').hidden=true;}
  function stop(reset=true){
   token++;running=false;clearInterval(timer);timer=null;
   for(const id of visualTimers)clearTimeout(id);visualTimers.clear();
   for(const osc of voices){try{osc.stop();}catch(e){}}voices.clear();
   paused=!reset;if(reset)step=0;
   $('upPractice').textContent=paused?'▶ Resume practice':'▶ Start practice';
   $('upStatus').textContent=paused?'Paused. Resume restarts the current bar.':'Practice stopped.';
   card.querySelectorAll('.up-chords span').forEach(el=>el.classList.remove('on'));
  }
  function paintChords(){
   $('upChords').replaceChildren();song().chords.forEach(c=>{const el=document.createElement('span');el.textContent=transposeChordName(c,currentTransposeShift);$('upChords').append(el);});
  }
  function refresh(){
   paintChords();if(shown===currentSongIndex)return;
   stop();closeRecording();shown=currentSongIndex;
   $('upUrl').value=video()?'https://www.youtube.com/watch?v='+video():'';
   $('upFile').value='';$('upTempo').value=Math.max(40,Math.min(180,song().bpm));updateTempoLabel();
   $('upSearch').href=video()?'https://www.youtube.com/watch?v='+video():'https://www.youtube.com/results?search_query='+encodeURIComponent(song().title+' '+song().artist+' official audio');
   $('upSearch').textContent=video()?'Open on YouTube ↗':'Find recording ↗';
   $('upMusic').hidden=!video();$('upMusic').href=video()?'https://music.youtube.com/watch?v='+video():'';
   $('upRecord').textContent=song().category==='glee'?'▶ Play Glee recording':'▶ Play recording';
   $('upUrl').hidden=!!seed[song().title];$('upSave').hidden=!!seed[song().title];
   card.querySelector('label[for="upUrl"]').hidden=!!seed[song().title];
   card.querySelector('details p').textContent=seed[song().title]?'The Glee Cast recording is already selected. You can also choose an audio file from your device.':'Paste a YouTube link once for this song, or choose an audio file from your device.';
   $('upRecordingStatus').textContent=files.has(key())?'Your audio file is ready.':video()?'Recording selected. Tap Play; if your browser asks, tap play inside the video too.':'Use Find recording, then save its YouTube link here.';
  }
  function updateTempoLabel(){$('upBpm').textContent=$('upTempo').value+' BPM';}
  $('upRecord').onclick=()=>{
   stopSounds();stop();closeRecording();
   if(files.has(key())){
    const a=document.createElement('audio');a.controls=true;a.src=files.get(key());$('upMedia').append(a);a.play().catch(()=>{$('upRecordingStatus').textContent='Tap the audio player’s play button to start.';});
   }else if(video()){
    const frame=document.createElement('iframe');frame.src='https://www.youtube.com/embed/'+video()+'?playsinline=1&rel=0&autoplay=1';frame.title=song().title+' recording';frame.allow='autoplay; encrypted-media; picture-in-picture';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';$('upMedia').append(frame);
    const a=document.createElement('a');a.className='up-link';a.textContent='Open on YouTube ↗';a.href='https://www.youtube.com/watch?v='+video();a.target='_blank';a.rel='noopener noreferrer';$('upMedia').append(a);
    $('upRecordingStatus').textContent='Tap play in the video. If the embed is unavailable, use Open on YouTube. Recording pitch and speed are separate from practice controls.';
   }else{$('upRecordingStatus').textContent='Find the recording and paste its link under Choose a recording, or select an audio file.';card.querySelector('details').open=true;return;}
   $('upClose').hidden=false;
  };
  $('upClose').onclick=closeRecording;
  $('upMusic').onclick=()=>{stopSounds();stop();closeRecording();document.getElementById('mcStop')?.click();};
  $('upSave').onclick=()=>{const id=parseVideo($('upUrl').value.trim());if(!id){$('upRecordingStatus').textContent='Please paste a valid YouTube video link.';return;}closeRecording();const old=files.get(key());if(old)URL.revokeObjectURL(old);files.delete(key());saved[key()]=id;$('upRecordingStatus').textContent=persist()?'Link saved for this song. Tap Play recording.':'Link ready for this session; browser storage is unavailable.';};
  $('upClear').onclick=()=>{closeRecording();delete saved[key()];persist();if(files.has(key()))URL.revokeObjectURL(files.get(key()));files.delete(key());shown=-1;refresh();};
  $('upFile').onchange=()=>{const f=$('upFile').files[0];if(!f)return;closeRecording();if(files.has(key()))URL.revokeObjectURL(files.get(key()));files.set(key(),URL.createObjectURL(f));$('upRecordingStatus').textContent=f.name+' ready. Tap Play recording.';};
  function pluck(freq,time){
   const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type='triangle';o.frequency.value=freq;f.type='lowpass';f.frequency.setValueAtTime(1800,time);f.frequency.exponentialRampToValueAtTime(450,time+.6);g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(.12,time+.008);g.gain.exponentialRampToValueAtTime(.001,time+.8);o.connect(f);f.connect(g);g.connect(audioCtx.destination);voices.add(o);o.onended=()=>{voices.delete(o);o.disconnect();f.disconnect();g.disconnect();};o.start(time);o.stop(time+.85);
  }
  function strum(chord,time,up){const v=CHORD_VOICINGS[chord];if(!v)return;const strings=up?[3,2,1,0]:[0,1,2,3];strings.forEach((s,i)=>pluck(STRING_FREQS[s]*2**((v[s]+currentTransposeShift)/12),time+i*.023));}
  function later(time,fn){const id=setTimeout(()=>{visualTimers.delete(id);fn();},Math.max(0,(time-audioCtx.currentTime)*1000));visualTimers.add(id);}
  function schedule(){
   if(!running)return;
   if(audioCtx.state!=='running'){stop(false);return;}
   const beat=60/Number($('upTempo').value);
   if(nextTime<audioCtx.currentTime-.2)nextTime=audioCtx.currentTime+.04;
   while(nextTime<audioCtx.currentTime+.12){
    const bar=sequence.length,chordIdx=Math.floor(step/bar)-1,slot=step%bar;
    if(chordIdx>=song().chords.length){if(!$('upLoop').checked){const end=nextTime;clearInterval(timer);later(end,()=>stop());return;}step=bar;continue;}
    const t=nextTime,event=sequence[slot];
    if(chordIdx<0){if(slot%2===0)pluck(880,t);}
    else if(event)strum(song().chords[chordIdx],t,event==='u');
    if(slot%2===0){later(t,()=>{card.querySelectorAll('.up-chords span').forEach((el,i)=>el.classList.toggle('on',i===chordIdx));$('upStatus').textContent=chordIdx<0?'Count in: '+(slot/2+1):transposeChordName(song().chords[chordIdx],currentTransposeShift)+' · Beat '+(slot/2+1);});}
    nextTime+=beat/2;step++;
   }
  }
  $('upPractice').onclick=async()=>{
   if(running){step=Math.max(0,Math.floor(Math.max(0,step-1)/sequence.length)*sequence.length);stop(false);return;}
   closeRecording();const ticket=++token;
   try{initAudioContext();if(!audioCtx)throw Error();await audioCtx.resume();if(ticket!==token)return;if(audioCtx.state!=='running')throw Error();
    sequence=$('upPattern').value==='island'?['d',null,'d','u',null,'u','d','u']:$('upPattern').value==='waltz'?['d',null,'d',null,'d',null]:['d',null,'d',null,'d',null,'d',null];

   }catch(e){stop();$('upStatus').textContent='Audio could not start. Tap Enable Audio, then try again.';}
  };

  const originalTranspose=transposeKey;
  transposeKey=function(delta){stop();originalTranspose(delta);};
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();closeRecording();}});
  window.addEventListener('pagehide',()=>{stop();closeRecording();});
  refresh();
 }

})();
</script>

<script>
// Experimental pitch-class feedback: an aid to practice, not a performance grade.
function ukePitchClasses(chord,shift=0){
 const m=/^([A-G])([b#]?)(m|7)?$/.exec(chord);if(!m)return [];
 const n={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+shift;
 return (m[3]==='m'?[0,3,7]:m[3]==='7'?[0,4,7,10]:[0,4,7]).map(x=>((x+n)%12+12)%12);
}
function ukeClassify(chroma,target,shift=0){
 const total=chroma.reduce((a,b)=>a+b,0);if(total<=0)return {kind:'neutral',label:'Listening…'};
 const p=chroma.map(x=>x/total),score=c=>{const pcs=ukePitchClasses(c,shift);const purity=pcs.reduce((a,i)=>a+p[i],0),coverage=pcs.filter(i=>p[i]>.075).length/pcs.length;return {name:c,purity,coverage,value:purity*.7+coverage*.3};};
 const expected=score(target),candidates=[];
 for(const n of ['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'])for(const suffix of ['','m','7'])candidates.push(score(n+suffix));
 candidates.sort((a,b)=>b.value-a.value);const best=candidates[0];
